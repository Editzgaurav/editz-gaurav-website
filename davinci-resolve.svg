<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">

  <defs>
    <!-- Outer rainbow gradient -->
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#28e0c5"/>
      <stop offset="22%"  stop-color="#21c8f2"/>
      <stop offset="45%"  stop-color="#9a9bea"/>
      <stop offset="62%"  stop-color="#e54c91"/>
      <stop offset="78%"  stop-color="#ff263d"/>
      <stop offset="100%" stop-color="#ffd51c"/>
    </linearGradient>

    <!-- Dark inner background -->
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#263b52"/>
      <stop offset="100%" stop-color="#172a3d"/>
    </linearGradient>

    <!-- Top cyan drop -->
    <radialGradient id="cyanDrop" cx="35%" cy="25%">
      <stop offset="0%" stop-color="#35f5ff"/>
      <stop offset="55%" stop-color="#00cde9"/>
      <stop offset="100%" stop-color="#7de3dc"/>
    </radialGradient>

    <!-- Yellow shape -->
    <radialGradient id="yellowShape" cx="35%" cy="25%">
      <stop offset="0%" stop-color="#eaff9a"/>
      <stop offset="45%" stop-color="#d9f52e"/>
      <stop offset="100%" stop-color="#d8d900"/>
    </radialGradient>

    <!-- Red shape -->
    <radialGradient id="redShape" cx="30%" cy="20%">
      <stop offset="0%" stop-color="#ffe2c4"/>
      <stop offset="35%" stop-color="#ff9d96"/>
      <stop offset="75%" stop-color="#f73555"/>
      <stop offset="100%" stop-color="#ed3040"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7"
                    flood-color="#000000" flood-opacity=".45"/>
    </filter>

    <!-- Soft highlight -->
    <radialGradient id="shine">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- White background -->
  <rect width="400" height="400" fill="#ffffff"/>

  <!-- Outer rounded rainbow body -->
  <rect x="43" y="40"
        width="314" height="320"
        rx="70"
        fill="url(#rainbow)"
        filter="url(#shadow)"/>

  <!-- Dark inner panel -->
  <rect x="57" y="55"
        width="286" height="290"
        rx="59"
        fill="#111d2c"/>

  <rect x="64" y="63"
        width="272" height="274"
        rx="53"
        fill="url(#darkBg)"/>

  <!-- Top drop -->
  <path
    d="M200 98
       C178 98 158 116 153 139
       C148 162 161 185 180 201
       C190 209 197 216 200 219
       C204 216 211 209 220 201
       C240 184 252 161 247 139
       C242 116 222 98 200 98Z"
    fill="url(#cyanDrop)"
    filter="url(#shadow)"/>

  <!-- Left yellow shape -->
  <path
    d="M190 207
       C169 194 137 192 115 204
       C92 217 81 244 87 269
       C93 295 116 308 141 307
       C168 306 188 287 198 263
       C205 247 209 224 190 207Z"
    fill="url(#yellowShape)"
    filter="url(#shadow)"/>

  <!-- Right red shape -->
  <path
    d="M210 207
       C231 194 263 192 285 204
       C308 217 319 244 313 269
       C307 295 284 308 259 307
       C232 306 212 287 202 263
       C195 247 191 224 210 207Z"
    fill="url(#redShape)"
    filter="url(#shadow)"/>

  <!-- Gloss highlights -->
  <ellipse cx="178" cy="122"
           rx="38" ry="25"
           fill="url(#shine)"
           opacity=".55"/>

  <ellipse cx="126" cy="226"
           rx="42" ry="22"
           fill="url(#shine)"
           opacity=".55"/>

  <ellipse cx="250" cy="226"
           rx="40" ry="21"
           fill="url(#shine)"
           opacity=".5"/>

</svg>
